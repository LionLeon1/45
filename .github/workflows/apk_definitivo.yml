name: APK Definitivo F1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Buscar y preparar el juego (.zip o .py)
        run: |
          # Si subiste un .zip en cualquier parte, lo descomprime
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descomprimiendo $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
          fi

          # Busca cualquier archivo .py del juego y lo copia como main.py
          PY_FILE=$(find . -maxdepth 3 -name "*.py" ! -name "main.py" | head -n 1)
          if [ -f "main.py" ]; then
            echo "Usando main.py existente."
          elif [ -n "$PY_FILE" ]; then
            echo "Usando archivo del juego: $PY_FILE"
            cp "$PY_FILE" main.py
          else
            echo "ERROR: No se encontró ningún archivo .py ni .zip en tu repositorio."
            echo "Archivos actuales en tu repositorio:"
            ls -la
            exit 1
          fi

      - name: 4. Instalar dependencias estables de Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake build-essential ccache lld libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install setuptools==69.5.1 packaging==23.2 cython==0.29.33 buildozer==1.5.0 virtualenv

      - name: 5. Crear buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Apex Life F1
          package.name = apexlifef1
          package.domain = org.apexlife
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json
          version = 2.0
          requirements = python3,kivy==2.3.0
          orientation = landscape
          fullscreen = 1
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: 6. Compilar APK
        run: |
          buildozer android debug > build.log 2>&1 || (grep -B 30 -A 5 "Command failed" build.log || tail -n 50 build.log; exit 1)

      - name: 7. Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: apex-life-f1-apk
          path: bin/*.apk
